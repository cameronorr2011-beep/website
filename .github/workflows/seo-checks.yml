name: Static site SEO checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Build all committed site bundles and canonical pages
        run: npm run build
      - name: Confirm generated pages are deterministic
        run: git diff --exit-code -- '*.html' sitemap.xml blog/data/kb.json Simulation/dist game/dist js/biological-cinema.js
      - name: Validate all public pages and scientific status
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Verify the static regression suite
        run: npm test
      - name: Check browser script syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check Simulation/js/persistence.js
          node --check Simulation/js/simulation-app.js
          node --check tools/site/qa_seo.mjs
