name: Focus of the Day

# Generates the daily algae research brief for the Blog page:
#   PubMed search -> GPT-OSS-120B (Groq) -> blog/data/focus/<date>.json
#
# Refresh time: 1:00 PM Pacific, every day, DST-safe.
#   GitHub cron is UTC-only and cannot express "1 PM America/Los_Angeles",
#   so the schedule fires at 20:00 and 21:00 UTC and the "at 1pm pacific"
#   gate below runs the generator only when it is exactly 13:00 in
#   America/Los_Angeles. That is 1 PM PDT (summer) or 1 PM PST (winter).
#   Manual runs (workflow_dispatch) skip the gate.

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 13:00 Pacific during PDT (Mar-Nov)
    - cron: "0 21 * * *"   # 21:00 UTC = 13:00 Pacific during PST (Nov-Mar)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-of-the-day
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run only at 1:00 PM Pacific (DST-safe gate)
        id: gate
        env:
          TZ: America/Los_Angeles
        run: |
          HOUR=$(date +%H)
          echo "Current hour in Pacific: $HOUR"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the 13:00 gate."
          elif [ "$HOUR" != "13" ]; then
            echo "Not 13:00 Pacific right now — nothing to do."
            exit 78 # neutral: the other scheduled slot owns this run
          fi

      - name: Generate today's focus
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/blog/generate_focus.py

      - name: Rotate daily article picks
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/blog/pick_articles.py

      - name: Commit new post
        run: |
          git config user.name "focus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/data/focus/ blog/data/picks/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add blog daily update for $(date -u +%F)"
            git push
          fi
