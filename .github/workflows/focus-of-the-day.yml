name: Daily blog refresh

# Generates the daily Blog content:
#   PubMed search -> GPT-OSS-120B (Groq) picks 4 papers and writes
#   a short grounded article for each -> blog/data/picks/<date>.json
#
# Refresh time: around 1:00 PM Pacific, every day, DST-safe.
#   GitHub cron is UTC-only and runners are routinely delayed by
#   minutes-to-hours, so an exact "hour == 13" gate silently skipped
#   most days. Instead: two cron slots (20:00 UTC primary, 21:30 UTC
#   backup) and an idempotent date gate -- whichever slot runs first
#   publishes the day and the other becomes a harmless skip.
#
#   The Pacific calendar date is exported here and passed to
#   pick_articles.py via --date, so the filename always matches the
#   gate date. Previously the script used the runner's UTC date:
#   a delayed run after 16:00 Pacific (00:00 UTC next day) generated
#   the NEXT day's file ~20 h early and silently skipped a day
#   (this happened on 2026-09-28), and the following day's run then
#   hit the "already exists" gate and failed red.
#
#   Manual runs (workflow_dispatch) also skip the gate.

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 1:00 PM Pacific during PDT (Mar-Nov)
    - cron: "30 21 * * *"  # backup slot: same Pacific calendar day if the primary fires late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Once per Pacific calendar day (idempotent gate)
        id: gate
        env:
          TZ: America/Los_Angeles
        run: |
          TODAY=$(date +%F)
          echo "Today in Pacific: $TODAY"
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run -- skipping the date gate."
          elif [ -f "blog/data/picks/$TODAY.json" ]; then
            echo "Picks for $TODAY already exist -- nothing to do."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Pick four papers and write them up
        if: ${{ env.skip != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python tools/blog/build_kb_index.py
          python tools/blog/pick_articles.py --date "$TODAY"

      - name: Commit new post
        if: ${{ env.skip != 'true' }}
        env:
          TZ: America/Los_Angeles
        run: |
          git config user.name "focus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/data/picks/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add blog daily update for $TODAY"
            git push
          fi
