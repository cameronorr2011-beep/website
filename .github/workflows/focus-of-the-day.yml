name: Daily blog refresh

# Generates the daily Blog content:
#   PubMed search -> GPT-OSS-120B (Groq) picks 4 papers and writes
#   a short grounded article for each -> blog/data/picks/<date>.json
#
# Refresh time: around 1:00 PM Pacific, every day, DST-safe.
#   GitHub cron is UTC-only and runners are routinely delayed by
#   minutes-to-hours, so an exact "hour == 13" gate silently skipped
#   most days. Instead: one cron slot at 20:00 UTC and an idempotent
#   date gate -- the generator itself rewrites today's file only if
#   it does not exist yet, so late firing is harmless and there is
#   exactly one publication per Pacific calendar day.
#   Manual runs (workflow_dispatch) also skip the gate.

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 13:00 Pacific during PDT (Mar-Nov)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Once per Pacific calendar day (idempotent gate)
        id: gate
        env:
          TZ: America/Los_Angeles
        run: |
          TODAY=$(date +%F)
          echo "Today in Pacific: $TODAY"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run -- skipping the date gate."
          elif [ -f "blog/data/picks/$TODAY.json" ]; then
            echo "Picks for $TODAY already exist -- nothing to do."
            exit 78 # neutral: today is already published
          fi

      - name: Pick four papers and write them up
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python tools/blog/build_kb_index.py
          python tools/blog/pick_articles.py

      - name: Commit new post
        run: |
          git config user.name "focus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/data/picks/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add blog daily update for $(date -u +%F)"
            git push
          fi
