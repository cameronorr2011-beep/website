name: Fix algae desk refresh path

on:
  push:
    paths:
      - .github/workflows/fix-algae-desk-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the button at the Worker API
        run: |
          set -euo pipefail
          grep -q "endpoint + '/refresh'" articles/algae-news/desk.js
          grep -q 'desk.js?v=20261120' articles/algae-news/index.html
          sed -i "s|endpoint + '/refresh'|endpoint + '/api/algae-refresh'|" articles/algae-news/desk.js
          sed -i "s|desk.js?v=20261120|desk.js?v=20261120b|" articles/algae-news/index.html
          grep -q "endpoint + '/api/algae-refresh'" articles/algae-news/desk.js
          rm .github/workflows/fix-algae-desk-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/algae-news/desk.js articles/algae-news/index.html .github/workflows/fix-algae-desk-refresh.yml
          git commit -F - <<'MSG'
          fix(algae-news): point the manual refresh at the Worker API

          The button posted to /refresh, but the Worker route is /api/algae-refresh,
          so every press failed before reaching Groq.

          🤖 Generated with Codebuff
          Co-Authored-By: Codebuff <noreply@codebuff.com>
          MSG
          git push
