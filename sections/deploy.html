<!-- ============ DEPLOY ============ -->
<section class="section dark" id="deploy">
  <div class="wrap" style="max-width:760px">
    <div class="section-reveal">
      <p class="eyebrow">Pilot access · deployment inquiry</p>
      <h2 class="h-display">Deploy Algaephyte</h2>
      <p class="lede" style="margin-top:24px">Algaephyte is entering controlled pilot deployments across research, production and education. Tell us the environment, intended scale and organism goal. This opens a deployment inquiry to service@orrbiologicals.com.</p>
    </div>
    <form class="deploy section-reveal" id="deployForm">
      <div class="field"><label for="fName">Name / organization</label><input id="fName" type="text" placeholder="Name or organization"></div>
      <div class="field"><label for="fPlace">Location</label><input id="fPlace" type="text" placeholder="City, country"></div>
      <div class="field"><label for="fGrow">Cultivation objective</label><textarea id="fGrow" placeholder="Classroom column, greenhouse mesh node, feed for filter feeders…"></textarea></div>
      <div class="field" style="display:none" aria-hidden="true"><label for="fHp">Leave blank</label><input id="fHp" type="text" tabindex="-1" autocomplete="off"></div>
      <button class="btn-white" type="submit">Open deployment inquiry</button>
    </form>
  </div>
</section>
