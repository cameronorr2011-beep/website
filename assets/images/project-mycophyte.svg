<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Mycophyte — mushroom fruiting chamber">
  <defs>
    <radialGradient id="mbg" cx=".5" cy=".42" r=".8">
      <stop offset="0" stop-color="#17130D"/>
      <stop offset="1" stop-color="#0D0B08"/>
    </radialGradient>
    <linearGradient id="mlid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="420" height="420" fill="url(#mbg)"/>

  <!-- chamber -->
  <rect x="90" y="96" width="240" height="250" rx="12" fill="#121008" stroke="#D9A441" stroke-opacity=".4" stroke-width="1.4"/>
  <!-- interior gradient -->
  <rect x="96" y="102" width="228" height="238" rx="8" fill="#1A160E"/>
  <rect x="96" y="102" width="228" height="238" rx="8" fill="#D9A441" opacity=".05"/>

  <!-- shelves -->
  <g stroke="#D9A441" stroke-opacity=".22" stroke-width="1.2">
    <path d="M96 200 h228 M96 282 h228"/>
  </g>

  <!-- LED bars -->
  <g>
    <rect x="110" y="112" width="14" height="70" rx="4" fill="url(#mlid)"/>
    <rect x="296" y="112" width="14" height="70" rx="4" fill="url(#mlid)"/>
    <rect x="110" y="194" width="14" height="70" rx="4" fill="url(#mlid)"/>
    <rect x="296" y="194" width="14" height="70" rx="4" fill="url(#mlid)"/>
  </g>

  <!-- substrate blocks -->
  <g fill="#4A3B22" stroke="#D9A441" stroke-opacity=".3" stroke-width="1">
    <rect x="170" y="226" width="56" height="46" rx="5"/>
    <rect x="246" y="226" width="56" height="46" rx="5"/>
    <rect x="170" y="308" width="56" height="30" rx="5"/>
    <rect x="246" y="308" width="56" height="30" rx="5"/>
  </g>

  <!-- fruiting bodies -->
  <g fill="#C9A468">
    <path d="M188 226 q0 -16 -10 -20 q2 12 -4 20Z"/>
    <path d="M206 226 q2 -18 -6 -24 q4 14 -2 24Z"/>
    <path d="M268 226 q-2 -16 8 -20 q-2 12 4 20Z"/>
    <path d="M192 308 q-4 -14 6 -16 q-2 10 4 16Z"/>
  </g>
  <g stroke="#E8D5AE" stroke-width="1.1" fill="none" opacity=".8">
    <path d="M183 226 v-8 M201 226 v-10 M264 226 v-7 M195 308 v-6"/>
  </g>

  <!-- mist line -->
  <g stroke="#57B8D6" stroke-opacity=".3" stroke-width="1.2">
    <path d="M96 130 h-16 v150 h16"/>
    <circle cx="80" cy="150" r="2" fill="#57B8D6" opacity=".4"/>
    <circle cx="80" cy="180" r="2.4" fill="#57B8D6" opacity=".3"/>
  </g>

  <!-- control node -->
  <rect x="316" y="120" width="70" height="56" rx="8" fill="#121008" stroke="#D9A441" stroke-opacity=".4" stroke-width="1.1"/>
  <rect x="316" y="120" width="70" height="3" fill="#D9A441" opacity=".5"/>
  <path d="M328 142 h30 M328 154 h22" stroke="#E8D5AE" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <circle cx="362" cy="148" r="4" fill="none" stroke="#D9A441" stroke-width="1.4"/>
  <circle cx="362" cy="148" r="1.8" fill="#D9A441"/>

  <!-- air duct top -->
  <rect x="150" y="78" width="120" height="18" rx="8" fill="#121008" stroke="#D9A441" stroke-opacity=".35" stroke-width="1.1"/>
  <path d="M210 78 v-12" stroke="#D9A441" stroke-opacity=".35" stroke-width="1.6"/>
  <circle cx="210" cy="62" r="4" fill="none" stroke="#D9A441" stroke-opacity=".4" stroke-width="1.3"/>
</svg>
