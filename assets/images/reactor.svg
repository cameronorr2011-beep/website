<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="t d">
  <title id="t">Schematic photobioreactor vessel</title>
  <desc id="d">Technical render of a column photobioreactor with light panels, sensors and gas supply</desc>
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1B16"/>
      <stop offset="1" stop-color="#0A1310"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9E70" stop-opacity=".9"/>
      <stop offset="1" stop-color="#155C3E" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7EFEB" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#E7EFEB" stop-opacity=".02"/>
      <stop offset="1" stop-color="#E7EFEB" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <rect width="480" height="560" fill="url(#rbg)"/>
  <ellipse cx="240" cy="528" rx="150" ry="14" fill="#3ECF8E" opacity=".05"/>

  <!-- light panels -->
  <g fill="#0F231B" stroke="#3ECF8E" stroke-opacity=".4" stroke-width="1">
    <rect x="60" y="170" width="26" height="250" rx="6"/>
    <rect x="394" y="170" width="26" height="250" rx="6"/>
  </g>
  <g stroke="#3ECF8E" stroke-opacity=".5" stroke-width="2">
    <path d="M86 200 v60 M86 270 v60 M86 340 v60"/>
    <path d="M394 200 v60 M394 270 v60 M394 340 v60"/>
  </g>
  <g stroke="#3ECF8E" stroke-opacity=".14" stroke-width="1" fill="none">
    <path d="M112 210 q120 -18 236 0 M112 300 q120 -18 236 0 M112 390 q120 -18 236 0"/>
  </g>

  <!-- vessel -->
  <rect x="132" y="96" width="216" height="392" rx="18" fill="#0B1712" stroke="#3ECF8E" stroke-opacity=".45" stroke-width="1.4"/>
  <rect x="138" y="176" width="204" height="306" rx="14" fill="url(#liq)"/>
  <ellipse cx="240" cy="176" rx="102" ry="11" fill="#8CE8BC" opacity=".4"/>
  <!-- liquid level line -->
  <path d="M138 176 h204" stroke="#8CE8BC" stroke-opacity=".6" stroke-width="1.2"/>
  <!-- bubbles -->
  <g fill="#BDF5D9" opacity=".4">
    <circle cx="210" cy="300" r="3.4"/><circle cx="252" cy="340" r="2.6"/><circle cx="286" cy="290" r="4"/>
    <circle cx="228" cy="390" r="2.2"/><circle cx="272" cy="420" r="3"/>
  </g>
  <!-- glass highlight -->
  <rect x="146" y="104" width="14" height="376" rx="7" fill="url(#glass)"/>

  <!-- head plate -->
  <rect x="124" y="72" width="232" height="34" rx="10" fill="#13221C" stroke="#3ECF8E" stroke-opacity=".45" stroke-width="1.2"/>
  <!-- sensors on head -->
  <rect x="168" y="44" width="12" height="30" rx="4" fill="#0F231B" stroke="#57B8D6" stroke-opacity=".5"/>
  <rect x="214" y="52" width="10" height="22" rx="3" fill="#0F231B" stroke="#57B8D6" stroke-opacity=".5"/>
  <circle cx="174" cy="52" r="2.4" fill="#57B8D6" opacity=".8"/>
  <!-- harvest port -->
  <rect x="300" y="60" width="16" height="14" rx="3" fill="none" stroke="#3ECF8E" stroke-opacity=".5"/>
  <path d="M308 74 v24" stroke="#3ECF8E" stroke-opacity=".5" stroke-width="2"/>

  <!-- gas line + sparger -->
  <path d="M180 500 v-64 a12 12 0 0 1 12 -12 h16" fill="none" stroke="#57B8D6" stroke-opacity=".55" stroke-width="2"/>
  <path d="M120 500 h220" stroke="#57B8D6" stroke-opacity=".3" stroke-width="1.4"/>
  <circle cx="180" cy="472" r="3" fill="#57B8D6" opacity=".5"/>

  <!-- OD sensor on wall -->
  <rect x="330" y="300" width="22" height="34" rx="5" fill="#0F231B" stroke="#3ECF8E" stroke-opacity=".5"/>
  <circle cx="341" cy="317" r="3" fill="#3ECF8E" opacity=".8"/>

  <!-- base -->
  <rect x="150" y="488" width="180" height="18" rx="8" fill="#13221C" stroke="#3ECF8E" stroke-opacity=".35"/>
</svg>
