<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Darkfield microscopy of Spirulina filaments">
  <defs>
    <radialGradient id="field" cx=".5" cy=".46" r=".75">
      <stop offset="0" stop-color="#0D1A15"/>
      <stop offset=".55" stop-color="#0A1310"/>
      <stop offset="1" stop-color="#060B09"/>
    </radialGradient>
    <radialGradient id="stain" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#1E5C41" stop-opacity=".5"/>
      <stop offset="1" stop-color="#1E5C41" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#field)"/>
  <rect width="1600" height="900" fill="url(#stain)"/>

  <!-- out-of-focus filaments (deep blur, background) -->
  <g filter="url(#blur10)" stroke="#2C8A60" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M-60 620 q 240 -160 420 -40 t 430 -90 t 420 30 t 470 -120" stroke-width="9"/>
    <path d="M-40 300 q 300 90 480 -30 t 420 60 t 420 -80" stroke-width="7"/>
    <path d="M200 860 q 260 -120 460 -30 t 460 -60" stroke-width="8"/>
  </g>

  <!-- mid-focus filaments -->
  <g filter="url(#blur3)" fill="none" stroke-linecap="round">
    <path d="M-80 520 q 320 -190 520 -20 t 540 -70 t 600 -110" stroke="#3FA873" stroke-width="7" opacity=".65"/>
    <path d="M-60 760 q 300 -140 500 -10 t 520 -60 t 620 -90" stroke="#359661" stroke-width="6.5" opacity=".55"/>
    <path d="M60 180 q 340 110 520 0 t 540 60 t 480 -70" stroke="#3FA873" stroke-width="6" opacity=".5"/>
  </g>

  <!-- in-focus filaments (sharp, brighter) -->
  <g fill="none" stroke-linecap="round">
    <path d="M-100 420 q 340 -210 540 -20 t 540 -80 t 620 -120" stroke="#79E0B0" stroke-width="4.5" opacity=".85"/>
    <path d="M-40 640 q 320 -150 520 -10 t 540 -60 t 600 -100" stroke="#8CE8BC" stroke-width="4" opacity=".8"/>
    <path d="M120 110 q 360 130 520 10 t 540 70 t 440 -60" stroke="#79E0B0" stroke-width="4" opacity=".6"/>
  </g>

  <!-- helical segment detail on the sharpest filament -->
  <g stroke="#BDF5D9" fill="none" stroke-width="1.6" opacity=".75" stroke-linecap="round">
    <path d="M120 396 q 22 -14 42 2 t 42 2 t 42 2 t 42 2 t 42 2 t 42 2"/>
    <path d="M430 400 q 22 -14 42 2 t 42 2 t 42 2"/>
    <path d="M980 330 q 22 -12 42 2 t 42 2 t 42 2"/>
    <path d="M1300 300 q 22 -12 42 2 t 42 2"/>
  </g>

  <!-- bright cells / artifacts in focus -->
  <g fill="#C9F7E0">
    <circle cx="430" cy="402" r="2.2" opacity=".9"/>
    <circle cx="556" cy="404" r="1.8" opacity=".8"/>
    <circle cx="980" cy="332" r="2" opacity=".85"/>
    <circle cx="1106" cy="334" r="1.6" opacity=".7"/>
    <circle cx="810" cy="470" r="1.8" opacity=".6"/>
    <circle cx="120" cy="398" r="2" opacity=".8"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#field)" opacity=".12"/>
  <radialGradient id="vig" cx=".5" cy=".5" r=".72">
    <stop offset=".62" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#020504" stop-opacity=".85"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
