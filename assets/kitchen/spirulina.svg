<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="spirulinaTitle spirulinaDesc">
  <title id="spirulinaTitle">A spirulina culture in a tall glass bottle</title>
  <desc id="spirulinaDesc">An illustration of deep green spirulina culture in a tall glass bottle, lit from behind so the colour glows through the glass, with fine bubbles rising.</desc>
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a15"/><stop offset="1" stop-color="#080e0b"/></linearGradient>
    <radialGradient id="pGlow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#a6c4a9" stop-opacity=".26"/><stop offset="1" stop-color="#a6c4a9" stop-opacity="0"/></radialGradient>
    <linearGradient id="pFill" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="#5d9a72"/><stop offset=".4" stop-color="#34704f"/><stop offset="1" stop-color="#15392a"/></linearGradient>
    <linearGradient id="pGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".18" stop-color="#fff" stop-opacity=".05"/><stop offset=".82" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="pCap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c8ae"/><stop offset="1" stop-color="#9c866d"/></linearGradient>
    <filter id="pSoft"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="pClip"><rect x="320" y="300" width="260" height="710" rx="76"/></clipPath>
  </defs>
  <rect width="900" height="1200" fill="url(#pBg)"/>
  <rect width="900" height="1200" fill="url(#pGlow)"/>
  <ellipse cx="450" cy="1028" rx="185" ry="24" fill="#000" opacity=".5" filter="url(#pSoft)"/>

  <g>
    <rect x="320" y="300" width="260" height="710" rx="76" fill="#0c130f" opacity=".9"/>
    <g clip-path="url(#pClip)">
      <rect x="320" y="410" width="260" height="600" fill="url(#pFill)"/>
      <rect x="320" y="400" width="260" height="20" fill="#9fd0ae" opacity=".45"/>
      <g fill="#c7e8cf" opacity=".35">
        <circle cx="365" cy="470" r="6"/><circle cx="420" cy="530" r="4"/><circle cx="500" cy="486" r="5"/>
        <circle cx="548" cy="590" r="7"/><circle cx="380" cy="640" r="4"/><circle cx="470" cy="700" r="6"/>
        <circle cx="540" cy="780" r="5"/><circle cx="352" cy="820" r="6"/><circle cx="440" cy="880" r="4"/>
        <circle cx="510" cy="930" r="7"/><circle cx="392" cy="960" r="4"/>
      </g>
      <g fill="#dff3e2" opacity=".2"><circle cx="410" cy="580" r="2.5"/><circle cx="466" cy="640" r="2"/><circle cx="516" cy="712" r="2.5"/><circle cx="430" cy="780" r="2"/></g>
      <rect x="320" y="300" width="260" height="710" fill="url(#pGlass)"/>
      <rect x="344" y="330" width="14" height="650" rx="7" fill="#fff" opacity=".15"/>
      <rect x="556" y="372" width="6" height="580" rx="3" fill="#fff" opacity=".05"/>
      <path d="M320 640c60 22 120-24 180 0" stroke="#bfe3c9" stroke-opacity=".16" stroke-width="8" fill="none"/>
    </g>
    <rect x="320" y="300" width="260" height="710" rx="76" fill="none" stroke="#e8f3e8" stroke-opacity=".24" stroke-width="3"/>
    <rect x="340" y="272" width="220" height="38" rx="16" fill="url(#pCap)"/>
    <rect x="340" y="302" width="220" height="10" rx="5" fill="#7d6a55" opacity=".6"/>
  </g>

  <g fill="#f3e6cd" opacity=".26"><circle cx="730" cy="330" r="3"/><circle cx="190" cy="430" r="2"/><circle cx="780" cy="620" r="2.5"/><circle cx="150" cy="760" r="2"/></g>
</svg>
