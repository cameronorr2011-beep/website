<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="shelfTitle shelfDesc">
  <title id="shelfTitle">Three home cultures on a kitchen shelf</title>
  <desc id="shelfDesc">A sourdough starter, a jar of kombucha and a bottle of spirulina sit on a wooden shelf in dim, warm forest-toned light.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a15"/><stop offset=".62" stop-color="#0d1411"/><stop offset="1" stop-color="#080d0a"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".74" cy=".16" r=".58">
      <stop offset="0" stop-color="#f0c9a4" stop-opacity=".38"/><stop offset=".45" stop-color="#d7a8a6" stop-opacity=".12"/><stop offset="1" stop-color="#d7a8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leafGlow" cx=".18" cy=".2" r=".45">
      <stop offset="0" stop-color="#a6c4a9" stop-opacity=".16"/><stop offset="1" stop-color="#a6c4a9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelfTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a2c"/><stop offset=".35" stop-color="#3b2e23"/><stop offset="1" stop-color="#241c16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff0e2" stop-opacity=".22"/><stop offset=".18" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".78" stop-color="#ffffff" stop-opacity=".02"/><stop offset="1" stop-color="#dff0e2" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="starter" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#e8d3ae"/><stop offset=".55" stop-color="#cbb18a"/><stop offset="1" stop-color="#8d7557"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#c78a4e"/><stop offset=".5" stop-color="#a5682f"/><stop offset="1" stop-color="#6b3f1c"/>
    </linearGradient>
    <linearGradient id="spirulina" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#4f8c66"/><stop offset=".5" stop-color="#2f6448"/><stop offset="1" stop-color="#14382a"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dbc8"/><stop offset=".5" stop-color="#cdbda6"/><stop offset="1" stop-color="#a48f78"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <clipPath id="jarA"><rect x="300" y="470" width="230" height="290" rx="26"/></clipPath>
    <clipPath id="jarB"><rect x="650" y="430" width="300" height="330" rx="30"/></clipPath>
    <clipPath id="jarC"><rect x="1075" y="360" width="180" height="400" rx="54"/></clipPath>
  </defs>

  <rect width="1600" height="1120" fill="url(#wall)"/>
  <rect width="1600" height="1120" fill="url(#lamp)"/>
  <rect width="1600" height="1120" fill="url(#leafGlow)"/>
  <rect width="1600" height="1120" filter="url(#grain)" opacity=".5"/>

  <!-- soft shadows and reflections on the shelf -->
  <ellipse cx="415" cy="784" rx="150" ry="20" fill="#000" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="800" cy="784" rx="180" ry="22" fill="#000" opacity=".5" filter="url(#soft)"/>
  <ellipse cx="1165" cy="784" rx="120" ry="18" fill="#000" opacity=".5" filter="url(#soft)"/>

  <!-- shelf -->
  <rect x="120" y="772" width="1360" height="30" rx="8" fill="url(#shelfTop)"/>
  <rect x="120" y="772" width="1360" height="5" rx="2.5" fill="#7a6150" opacity=".5"/>
  <rect x="120" y="802" width="1360" height="10" rx="4" fill="#120d09" opacity=".65"/>
  <rect x="150" y="812" width="1300" height="220" fill="#0a0f0c" opacity=".55"/>

  <!-- sourdough starter -->
  <g>
    <rect x="300" y="470" width="230" height="290" rx="26" fill="#0c130f" opacity=".85"/>
    <g clip-path="url(#jarA)">
      <rect x="300" y="560" width="230" height="210" fill="url(#starter)"/>
      <rect x="300" y="548" width="230" height="26" fill="#f0e2c6" opacity=".5"/>
      <g fill="#f7edda" opacity=".55">
        <circle cx="352" cy="608" r="7"/><circle cx="398" cy="646" r="5"/><circle cx="455" cy="598" r="8"/>
        <circle cx="480" cy="672" r="6"/><circle cx="370" cy="700" r="9"/><circle cx="430" cy="726" r="5"/>
        <circle cx="500" cy="620" r="4"/><circle cx="330" cy="662" r="4"/>
      </g>
      <g fill="#8d7557" opacity=".45"><circle cx="420" cy="580" r="4"/><circle cx="470" cy="700" r="7"/><circle cx="345" cy="742" r="6"/></g>
      <rect x="300" y="470" width="230" height="290" fill="url(#glass)"/>
      <rect x="318" y="486" width="10" height="250" rx="5" fill="#fff" opacity=".13"/>
    </g>
    <rect x="300" y="470" width="230" height="290" rx="26" fill="none" stroke="#e6f2e6" stroke-opacity=".28" stroke-width="2"/>
    <rect x="292" y="452" width="246" height="24" rx="9" fill="#d9c8ae"/>
    <path d="M292 452c22 14 46-10 70 4s48-12 74 2 50-12 72 2v-18H292z" fill="url(#cloth)"/>
    <rect x="292" y="430" width="246" height="22" rx="10" fill="url(#cloth)"/>
    <rect x="292" y="450" width="246" height="6" rx="3" fill="#8a745e" opacity=".7"/>
  </g>

  <!-- kombucha -->
  <g>
    <rect x="650" y="430" width="300" height="330" rx="30" fill="#0c130f" opacity=".85"/>
    <g clip-path="url(#jarB)">
      <rect x="650" y="520" width="300" height="240" fill="url(#tea)"/>
      <rect x="650" y="512" width="300" height="16" fill="#e6cfae" opacity=".65"/>
      <ellipse cx="800" cy="522" rx="132" ry="16" fill="#e9d6b6" opacity=".85"/>
      <ellipse cx="800" cy="526" rx="108" ry="10" fill="#f3e5c9" opacity=".6"/>
      <g fill="#f0dbb8" opacity=".18"><circle cx="720" cy="600" r="3"/><circle cx="860" cy="650" r="4"/><circle cx="780" cy="700" r="3"/></g>
      <rect x="650" y="430" width="300" height="330" fill="url(#glass)"/>
      <rect x="672" y="452" width="12" height="286" rx="6" fill="#fff" opacity=".12"/>
      <path d="M700 470c40 18 90-16 130 4" stroke="#ffe9c8" stroke-opacity=".25" stroke-width="6" fill="none"/>
    </g>
    <rect x="650" y="430" width="300" height="330" rx="30" fill="none" stroke="#e6f2e6" stroke-opacity=".26" stroke-width="2"/>
    <rect x="640" y="410" width="320" height="26" rx="10" fill="#b9d2c2" opacity=".55"/>
    <rect x="760" y="392" width="80" height="22" rx="10" fill="#9db8a8" opacity=".5"/>
  </g>

  <!-- spirulina -->
  <g>
    <rect x="1075" y="360" width="180" height="400" rx="54" fill="#0c130f" opacity=".85"/>
    <g clip-path="url(#jarC)">
      <rect x="1075" y="430" width="180" height="330" fill="url(#spirulina)"/>
      <rect x="1075" y="424" width="180" height="14" fill="#7fb894" opacity=".45"/>
      <g fill="#bfe3c9" opacity=".4">
        <circle cx="1112" cy="500" r="5"/><circle cx="1150" cy="548" r="3"/><circle cx="1196" cy="512" r="4"/>
        <circle cx="1170" cy="616" r="5"/><circle cx="1122" cy="660" r="3"/><circle cx="1210" cy="686" r="4"/>
      </g>
      <rect x="1075" y="360" width="180" height="400" fill="url(#glass)"/>
      <rect x="1094" y="392" width="9" height="336" rx="4.5" fill="#fff" opacity=".14"/>
      <rect x="1226" y="410" width="5" height="300" rx="2.5" fill="#fff" opacity=".06"/>
    </g>
    <rect x="1075" y="360" width="180" height="400" rx="54" fill="none" stroke="#e6f2e6" stroke-opacity=".26" stroke-width="2"/>
    <rect x="1092" y="336" width="146" height="28" rx="12" fill="#c6b59b"/>
    <rect x="1092" y="356" width="146" height="8" rx="4" fill="#8a745e" opacity=".65"/>
  </g>

  <!-- dust motes and rim light -->
  <g fill="#f3e6cd" opacity=".28" filter="url(#tiny)">
    <circle cx="980" cy="250" r="3"/><circle cx="1240" cy="300" r="2"/><circle cx="560" cy="330" r="2"/>
    <circle cx="1350" cy="200" r="2.5"/><circle cx="240" cy="260" r="2"/>
  </g>
  <path d="M96 900h1408" stroke="#a6c4a9" stroke-opacity=".08" stroke-width="2"/>
</svg>
