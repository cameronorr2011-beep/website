<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="starterTitle starterDesc">
  <title id="starterTitle">A sourdough starter in a cloth-covered jar</title>
  <desc id="starterDesc">An illustration of a glass jar filled with bubbly sourdough starter, covered with a linen cloth tied with string, lit warmly from one side.</desc>
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c17"/><stop offset="1" stop-color="#0a100d"/></linearGradient>
    <radialGradient id="sGlow" cx=".28" cy=".26" r=".62"><stop offset="0" stop-color="#f0c9a4" stop-opacity=".3"/><stop offset="1" stop-color="#f0c9a4" stop-opacity="0"/></radialGradient>
    <linearGradient id="sFill" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="#f0dcb6"/><stop offset=".5" stop-color="#d3b98f"/><stop offset="1" stop-color="#96795a"/></linearGradient>
    <linearGradient id="sGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".2" stop-color="#fff" stop-opacity=".04"/><stop offset=".8" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="sCloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe4d2"/><stop offset=".55" stop-color="#cfc0a8"/><stop offset="1" stop-color="#9c886f"/></linearGradient>
    <filter id="sSoft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="sClip"><rect x="290" y="420" width="320" height="600" rx="34"/></clipPath>
  </defs>
  <rect width="900" height="1200" fill="url(#sBg)"/>
  <rect width="900" height="1200" fill="url(#sGlow)"/>
  <ellipse cx="450" cy="1044" rx="215" ry="26" fill="#000" opacity=".55" filter="url(#sSoft)"/>

  <g>
    <rect x="290" y="420" width="320" height="600" rx="34" fill="#0c130f" opacity=".9"/>
    <g clip-path="url(#sClip)">
      <rect x="290" y="556" width="320" height="464" fill="url(#sFill)"/>
      <rect x="290" y="540" width="320" height="30" fill="#f6e8cc" opacity=".45"/>
      <g fill="#fff8e8" opacity=".5">
        <circle cx="352" cy="640" r="10"/><circle cx="410" cy="700" r="6"/><circle cx="486" cy="626" r="12"/>
        <circle cx="540" cy="720" r="7"/><circle cx="382" cy="782" r="13"/><circle cx="470" cy="836" r="8"/>
        <circle cx="560" cy="866" r="6"/><circle cx="330" cy="880" r="7"/><circle cx="520" cy="920" r="10"/>
        <circle cx="420" cy="950" r="5"/><circle cx="360" cy="740" r="4"/><circle cx="585" cy="650" r="4"/>
      </g>
      <g fill="#8f7355" opacity=".35"><circle cx="450" cy="676" r="6"/><circle cx="570" cy="790" r="9"/><circle cx="320" cy="820" r="6"/><circle cx="490" cy="976" r="7"/></g>
      <rect x="290" y="420" width="320" height="600" fill="url(#sGlass)"/>
      <rect x="314" y="444" width="14" height="540" rx="7" fill="#fff" opacity=".14"/>
      <rect x="566" y="470" width="6" height="480" rx="3" fill="#fff" opacity=".05"/>
    </g>
    <rect x="290" y="420" width="320" height="600" rx="34" fill="none" stroke="#e8f3e8" stroke-opacity=".26" stroke-width="3"/>
    <rect x="284" y="398" width="332" height="26" rx="10" fill="#d8c7ac"/>

    <!-- linen cover, softly crumpled -->
    <path d="M280 400c10-34 42-18 58-34s52 8 72-6 58 14 84-2 62 10 92-4 58 20 66 46l-14 22c-40-16-74 10-112-2s-70 12-104 0-66 14-96 2-38 4-46-22z" fill="url(#sCloth)"/>
    <path d="M280 400c26 18 52 0 78 10s54-10 82 2 56-8 86 4 50-6 74-4" fill="none" stroke="#8c7861" stroke-opacity=".45" stroke-width="2"/>
    <rect x="284" y="414" width="332" height="12" rx="6" fill="#8b7660" opacity=".55"/>
    <path d="M300 424c30 26 60-6 92 14s58-10 90 10 56-8 84 12" fill="none" stroke="#b9a68c" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <path d="M480 428c14 22-6 34 4 52" fill="none" stroke="#c9b69c" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  </g>

  <g fill="#f3e6cd" opacity=".3"><circle cx="700" cy="300" r="3"/><circle cx="220" cy="360" r="2"/><circle cx="760" cy="520" r="2"/><circle cx="170" cy="700" r="2.5"/></g>
</svg>
