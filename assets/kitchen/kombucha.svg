<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="kombuchaTitle kombuchaDesc">
  <title id="kombuchaTitle">Kombucha fermenting in a wide glass jar</title>
  <desc id="kombuchaDesc">An illustration of amber kombucha in a wide jar with a pale cellulose pellicle floating at the surface, rim lit in warm rose light.</desc>
  <defs>
    <linearGradient id="kBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161c16"/><stop offset="1" stop-color="#0a0f0c"/></linearGradient>
    <radialGradient id="kGlow" cx=".72" cy=".24" r=".6"><stop offset="0" stop-color="#d7a8a6" stop-opacity=".28"/><stop offset="1" stop-color="#d7a8a6" stop-opacity="0"/></radialGradient>
    <linearGradient id="kFill" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#d09a5c"/><stop offset=".45" stop-color="#b5763a"/><stop offset="1" stop-color="#6a3d1b"/></linearGradient>
    <linearGradient id="kGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".22" stop-color="#fff" stop-opacity=".04"/><stop offset=".8" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <radialGradient id="kPellicle" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#f7e9cd"/><stop offset=".7" stop-color="#e2cba6"/><stop offset="1" stop-color="#c3a97f"/></radialGradient>
    <filter id="kSoft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="kClip"><rect x="245" y="390" width="410" height="600" rx="46"/></clipPath>
  </defs>
  <rect width="900" height="1200" fill="url(#kBg)"/>
  <rect width="900" height="1200" fill="url(#kGlow)"/>
  <ellipse cx="450" cy="1032" rx="250" ry="26" fill="#000" opacity=".55" filter="url(#kSoft)"/>

  <g>
    <rect x="245" y="390" width="410" height="600" rx="46" fill="#0c130f" opacity=".9"/>
    <g clip-path="url(#kClip)">
      <rect x="245" y="520" width="410" height="470" fill="url(#kFill)"/>
      <rect x="245" y="510" width="410" height="18" fill="#f0d5a8" opacity=".5"/>
      <ellipse cx="450" cy="524" rx="192" ry="22" fill="url(#kPellicle)"/>
      <ellipse cx="450" cy="530" rx="158" ry="13" fill="#f8eed7" opacity=".55"/>
      <path d="M300 540c40 10 74-8 112 2s76-10 118 0 56-6 76 2" fill="none" stroke="#c6ac85" stroke-opacity=".6" stroke-width="3"/>
      <g fill="#f4dfb9" opacity=".16"><circle cx="330" cy="640" r="4"/><circle cx="560" cy="700" r="5"/><circle cx="420" cy="780" r="4"/><circle cx="620" cy="620" r="3"/></g>
      <g stroke="#ffdca8" stroke-opacity=".22" stroke-width="4" fill="none"><path d="M300 620c40 26 78-22 120 4s72-18 116 8"/><path d="M280 880c48-18 84 22 132-4s90 20 140-6"/></g>
      <rect x="245" y="390" width="410" height="600" fill="url(#kGlass)"/>
      <rect x="276" y="416" width="16" height="548" rx="8" fill="#fff" opacity=".13"/>
      <rect x="622" y="452" width="7" height="500" rx="3.5" fill="#fff" opacity=".05"/>
    </g>
    <rect x="245" y="390" width="410" height="600" rx="46" fill="none" stroke="#e8f3e8" stroke-opacity=".24" stroke-width="3"/>
    <rect x="236" y="368" width="428" height="28" rx="12" fill="#b9cbbd" opacity=".5"/>
    <rect x="380" y="350" width="140" height="22" rx="10" fill="#9fb4a6" opacity=".45"/>
  </g>

  <!-- tea tag resting against the jar -->
  <g transform="rotate(-8 660 640)">
    <path d="M640 430v170" stroke="#d9cbb4" stroke-opacity=".5" stroke-width="2"/>
    <rect x="618" y="596" width="52" height="76" rx="4" fill="#f0e6d2" opacity=".88"/>
    <path d="M618 610h52M618 620h52M618 630h34" stroke="#8a7a63" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <g fill="#f3e6cd" opacity=".28"><circle cx="740" cy="300" r="3"/><circle cx="170" cy="420" r="2"/><circle cx="800" cy="560" r="2"/><circle cx="130" cy="760" r="2.5"/></g>
</svg>
